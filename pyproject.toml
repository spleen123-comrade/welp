[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "welp"
version = "0.2.1"
description = "Multi-chain DEX launch intelligence and rug-protection platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = [
    "welp_core*",
    "welp_chains*",
    "welp_dex*",
    "welp_radar*",
    "welp_market*",
    "welp_security*",
    "welp_safety*",
]
